<text x="658" y="324" fill="#2866a0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">wrap</text>
<text x="48" y="500" fill="#5d7180" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">The Ewald correction accounts for the other periodic images.</text>
